<!doctype html><html><head>
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#events{position:fixed;top:0;left:0;background:white;color:black;z-index:10;font:16px monospace;pointer-events:none}</style>
</head><body><div id="player"></div><pre id="events"></pre>
<script>
function notify(state) {
  document.getElementById('events').textContent += state + '\n';
  if (window.flutter_inappwebview) window.flutter_inappwebview.callHandler('speshTrailer', state);
}
function onYouTubeIframeAPIReady() {
  window.player = new YT.Player('player', {
    videoId:'M7lc1UVf-VE', width:'100%', height:'100%',
    playerVars:{autoplay:1,controls:1,playsinline:1,origin:location.origin},
    events:{onReady:function(){notify('ready');},
      onStateChange:function(e){if(e.data===1)notify('playing');if(e.data===0)notify('ended');},
      onError:function(e){notify('error:'+e.data);}}
  });
}
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
